<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
	svg { display: block; width: 128px; height: 128px; }
	[data-v] { display: none; }
</style>

<svg viewBox="0 0 128 128" aria-hidden="true">
	<defs>
		<radialGradient id="bg-light" cx="35%" cy="20%" r="95%">
			<stop offset="0" stop-color="#f7f4ef"/><stop offset=".55" stop-color="#eeeae3"/><stop offset="1" stop-color="#e5dfd5"/>
		</radialGradient>
		<radialGradient id="bg-dark" cx="35%" cy="20%" r="95%">
			<stop offset="0" stop-color="#2c2723"/><stop offset=".7" stop-color="#141210"/>
		</radialGradient>
		<radialGradient id="floor" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#171513" stop-opacity=".34"/><stop offset="1" stop-color="#171513" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="floor-dark" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="hl" cx="33%" cy="28%" r="45%">
			<stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="shade" cx="35%" cy="30%" r="80%">
			<stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".24"/>
		</radialGradient>
		<filter id="card-shadow" x="-30%" y="-30%" width="160%" height="170%">
			<feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#171513" flood-opacity=".28"/>
		</filter>

		<!-- The Forma mark at r=36 around (0,0): ink half from 7 o'clock to 1 o'clock, accent half opposite. -->
		<g id="mark-ink">
			<g class="spin">
				<path d="M-18 31.18A36 36 0 0 1 18 -31.18Z" fill="#171513"/>
				<path d="M18 -31.18A36 36 0 0 1 -18 31.18Z" fill="#b4532a"/>
			</g>
			<circle r="34" fill="none" stroke="#171513" stroke-width="4"/>
			<circle r="36" fill="url(#shade)"/>
			<circle r="36" fill="url(#hl)"/>
		</g>
		<g id="mark-cream">
			<g class="spin">
				<path d="M-18 31.18A36 36 0 0 1 18 -31.18Z" fill="#f1ebe1"/>
				<path d="M18 -31.18A36 36 0 0 1 -18 31.18Z" fill="#b4532a"/>
			</g>
			<circle r="34" fill="none" stroke="#f1ebe1" stroke-width="4"/>
			<circle r="36" fill="url(#shade)"/>
			<circle r="36" fill="url(#hl)"/>
		</g>
	</defs>

	<!-- A: light -->
	<g data-v="light">
		<rect width="128" height="128" fill="url(#bg-light)"/>
		<ellipse cx="64" cy="104" rx="38" ry="6.5" fill="url(#floor)"/>
		<use href="#mark-ink" transform="translate(64 60)"/>
	</g>

	<!-- B: dark -->
	<g data-v="dark">
		<rect width="128" height="128" fill="url(#bg-dark)"/>
		<ellipse cx="64" cy="104" rx="38" ry="6.5" fill="url(#floor-dark)"/>
		<use href="#mark-cream" transform="translate(64 60)"/>
	</g>

	<!-- C: a fan of ready-made designs, the mark on the front one -->
	<g data-v="cards">
		<rect width="128" height="128" fill="url(#bg-light)"/>
		<g filter="url(#card-shadow)">
			<g class="fan" data-dir="-1" transform="rotate(-14 64 150)">
				<rect x="35" y="22" width="58" height="80" rx="7" fill="#141210"/>
				<rect x="42" y="30" width="20" height="3" rx="1.5" fill="#f1ebe1" opacity=".55"/>
			</g>
			<g class="fan" data-dir="1" transform="rotate(14 64 150)">
				<rect x="35" y="22" width="58" height="80" rx="7" fill="#b4532a"/>
				<rect x="66" y="30" width="20" height="3" rx="1.5" fill="#f1ebe1" opacity=".6"/>
			</g>
			<rect x="33" y="17" width="62" height="88" rx="8" fill="#f1ebe1"/>
		</g>
		<rect x="41" y="25" width="18" height="3" rx="1.5" fill="#171513" opacity=".35"/>
		<ellipse cx="64" cy="86" rx="17" ry="3" fill="url(#floor)"/>
		<use href="#mark-ink" transform="translate(64 61) scale(.52)"/>
		<rect x="48" y="93" width="32" height="6" rx="3" fill="#171513"/>
	</g>
</svg>
<script>
	const v = new URLSearchParams(location.search).get('v') || 'light';
	document.querySelector(`[data-v="${v}"]`).style.display = 'inline';
</script>
<script>
	// 3.2 s loop: the mark turns half a turn, rests, turns again, like the logo hover in the theme.
	const T = 3.2;
	const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
	const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
	window.__frame = (t) => {
		t = ((t % T) + T) % T;
		const p1 = seg(t, 0.4, 1.2), p2 = seg(t, 2.0, 2.8);
		const rot = 180 * (ease(p1) + ease(p2));
		document.querySelectorAll('.spin').forEach((g) => g.setAttribute('transform', `rotate(${rot})`));
		const spread = 3 * (Math.sin(Math.PI * p1) + Math.sin(Math.PI * p2));
		document.querySelectorAll('.fan').forEach((g) => {
			g.setAttribute('transform', `rotate(${g.dataset.dir * (14 + spread)} 64 150)`);
		});
	};
	window.__frame(0);
</script>
<script src="trim.js"></script>
